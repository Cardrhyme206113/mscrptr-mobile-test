name: Publish APK Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MuScriptor-Mobile-v0.4.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.4.1 --cleanup-tag --yes || true
          gh release create v0.4.1 \
            MuScriptor-Mobile-v0.4.1.apk \
            --target "$GITHUB_SHA" \
            --title "MuScriptor Mobile v0.4.1" \
            --notes "Minimalist interface update on top of v0.4.0. Replaces the default Android-looking screen with a clean Material 3 card layout, compact spacing, consistent rounded controls, a persistent Light/Dark toggle, matching status/navigation bars, and a piano roll palette that follows the selected theme. Theme switching is disabled during active downloads or transcription so Activity recreation cannot interrupt inference. Includes all CPU, automatic GPU/NPU NNAPI, NNAPI+FP16, and parallel accelerator-conditioner + CPU-decoder modes from v0.4.0. Existing downloaded model files are reused."

      - name: Persist release link
        run: |
          mkdir -p ci
          echo 'https://github.com/${{ github.repository }}/releases/tag/v0.4.1' > ci/release-url.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/release-url.txt
          git commit -m "docs: record v0.4.1 release URL" || exit 0
          git push
