name: Publish APK Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MuScriptor-Mobile-v0.2.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.1 --cleanup-tag --yes || true
          gh release create v0.2.1 \
            MuScriptor-Mobile-v0.2.1.apk \
            --target "$GITHUB_SHA" \
            --title "MuScriptor Mobile v0.2.1" \
            --notes "Critical live MIDI audio fix. The preview synth previously deleted every melodic note on the first sample because its attack envelope intentionally begins at zero amplitude. Melodic voices now survive the attack and are removed only after note release; drums still expire after natural decay. Also validates MIDI AudioTrack initialization, clamps incoming MIDI pitch/program values, and increases synth output gain so the default 80% MIDI / 20% song mix is clearly audible. Existing downloaded model files are reused."

      - name: Persist release link
        run: |
          mkdir -p ci
          echo 'https://github.com/${{ github.repository }}/releases/tag/v0.2.1' > ci/release-url.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/release-url.txt
          git commit -m "docs: record v0.2.1 release URL" || exit 0
          git push
