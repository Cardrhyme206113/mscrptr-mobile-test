name: Publish APK Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MuScriptor-Mobile-v0.5.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.5.0 --cleanup-tag --yes || true
          gh release create v0.5.0 \
            MuScriptor-Mobile-v0.5.0.apk \
            --target "$GITHUB_SHA" \
            --title "MuScriptor Mobile v0.5.0" \
            --notes "Overlap and boundary-continuity update. The fixed-shape conditioner still sees native 5-second inputs, but windows now advance every 4 seconds, giving 1 second of shared context: 0-5, 4-9, 8-13, and so on. Each window decodes independently to avoid rewinding decoder state; only stable center ownership regions are committed, boundary continuations are recovered, onset-jitter duplicates are suppressed, and adjacent same-note segments are merged for exported MIDI. Live preview now follows the actual finalized center frontier instead of assuming every completed window finalized a full 5 seconds. Adds an experimental 1200 KV-cache profile (~225 MiB) while keeping 1024 recommended. The light/dark interface now uses sharp 2-3 dp corners and an orange accent. All CPU, NNAPI GPU/NPU, FP16, and parallel conditioner/CPU modes remain. Existing model files are reused."

      - name: Persist release link
        run: |
          mkdir -p ci
          echo 'https://github.com/${{ github.repository }}/releases/tag/v0.5.0' > ci/release-url.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/release-url.txt
          git commit -m "docs: record v0.5.0 release URL" || exit 0
          git push
