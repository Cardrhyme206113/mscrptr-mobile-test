name: Publish APK Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MuScriptor-Mobile-v0.2.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.0 --cleanup-tag --yes || true
          gh release create v0.2.0 \
            MuScriptor-Mobile-v0.2.0.apk \
            --target "$GITHUB_SHA" \
            --title "MuScriptor Mobile v0.2.0" \
            --notes "Buffered real-time player update. The original song and generated MIDI now play together while inference continues. Playback targets a 3-second finalized-MIDI lead, slows with pitch preserved when inference catches up, and only performs a brief emergency hold at zero safe buffer. Includes live original-song and MIDI volume sliders (20%/80% defaults), pause/restart controls, a lightweight polyphonic preview synth, 1024/896/768 KV-cache profiles, clean cache-limit truncation, and streaming 16 kHz audio decode to reduce Java heap pressure. Existing downloaded model files are reused."

      - name: Persist release link
        run: |
          mkdir -p ci
          echo 'https://github.com/${{ github.repository }}/releases/tag/v0.2.0' > ci/release-url.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/release-url.txt
          git commit -m "docs: record v0.2.0 release URL" || exit 0
          git push
