name: Publish APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release.yml'

concurrency:
  group: muscriptor-v0.7.1-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate and validate cache decoder variants
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2' 'onnxruntime>=1.20,<2' numpy
          mkdir -p .cache/muscriptor app/src/main/assets/cache_decoders
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx?download=true'
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx.data \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx.data?download=true'
          python tools/generate_cache_variants.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders
          python tools/generate_native_gqa_cache.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders
          python tools/smoke_test_cache_variants.py \
            --variants app/src/main/assets/cache_decoders \
            --external-data .cache/muscriptor/decoder.onnx.data \
            --max-cache 512

      - name: Build signed APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MuScriptor-Mobile-v0.7.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.7.1 --cleanup-tag --yes || true
          gh release create v0.7.1 \
            MuScriptor-Mobile-v0.7.1.apk \
            --target "$GITHUB_SHA" \
            --title "MuScriptor Mobile v0.7.1" \
            --notes "Live-preview and viewer patch. Content-provider audio is now copied to a private seekable playback file on a separate thread while inference starts, with the original MIME type passed to ExoPlayer, preventing the preview from remaining stuck on Preparing original audio player under heavy CPU/NNAPI load. The MIDI scheduler drains due events under one lock and preview UI callbacks are deduplicated. The piano roll now uses the app's actual surface, outline, text, and orange accent colors instead of a separate blue-black palette. Rendering uses sharp non-antialiased note rectangles, clips note drawing to the plot, caps inference-event redraws at 20 fps, and drains large event bursts in bounded batches. Includes the native fused FP16 GQA cache path from v0.7.0 and keeps the persistent v0.6+ sideload signature."

      - name: Persist release link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          echo 'https://github.com/${{ github.repository }}/releases/tag/v0.7.1' > ci/release-url.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/release-url.txt
          git commit -m "docs: record v0.7.1 release URL" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
