name: Build and launch-test MuScript Pocket APK
on:
  workflow_dispatch:
  push:
    branches: [muscript-pocket-native-build]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
    - name: Apply MuScript Pocket v2 sources
      working-directory: pocket-native
      run: |
        base64 -d ci/pocket-v2-source.b64 | tar -xz
        python3 ci/fix_startup.py
        test -f app/src/main/assets/index.html
    - name: Assemble debug APK
      working-directory: pocket-native
      run: gradle --no-daemon :app:assembleDebug --stacktrace
    - name: Launch Android emulator and verify startup
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: bash pocket-native/ci/emulator_smoke.sh
    - name: Upload emulator crash logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pocket-startup-logcat
        path: startup-logcat.txt
        if-no-files-found: ignore
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: muscript-pocket-debug-apk
        path: pocket-native/app/build/outputs/apk/debug/app-debug.apk
