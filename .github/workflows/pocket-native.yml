name: Build MuScript Pocket APK
on:
  workflow_dispatch:
  push:
    branches: [muscript-pocket-native-build]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
    - run: gradle --no-daemon :app:assembleDebug --stacktrace
      working-directory: pocket-native
    - uses: actions/upload-artifact@v4
      with:
        name: muscript-pocket-debug-apk
        path: pocket-native/app/build/outputs/apk/debug/app-debug.apk
