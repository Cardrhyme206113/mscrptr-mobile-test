name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate and test cache decoder variants
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2' 'onnxruntime>=1.20,<2' numpy
          mkdir -p .cache/muscriptor app/src/main/assets/cache_decoders
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx?download=true'
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx.data \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx.data?download=true'
          python tools/inspect_decoder_graph.py --decoder .cache/muscriptor/decoder.onnx | tee decoder-graph.txt
          python tools/generate_cache_variants.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders
          python tools/smoke_test_cache_variants.py \
            --variants app/src/main/assets/cache_decoders \
            --external-data .cache/muscriptor/decoder.onnx.data \
            --max-cache 512
          ls -lh app/src/main/assets/cache_decoders

      - name: Build and test
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          mkdir -p ci
          {
            echo "exit_code=$code"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%FT%TZ)"
            echo
            cat decoder-graph.txt 2>/dev/null || true
            echo
            tail -n 600 build.log
          } > ci/android-build-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload debug APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: muscriptor-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Persist build report
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/android-build-report.txt
          git commit -m "ci: update Android build report" || exit 0
          git push

      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
