name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'signing/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Wire K8V8 source integration
        run: python tools/apply_k8v8_source_patch.py

      - name: Fetch pinned ONNX Runtime custom-op headers
        run: bash tools/fetch_ort_headers.sh

      - name: Generate, test, and benchmark cache decoders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2' 'onnxruntime>=1.26,<2' numpy
          mkdir -p .cache/muscriptor app/src/main/assets/cache_decoders ci
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx?download=true'
          curl -L --fail --retry 4 --retry-delay 2 \
            -o .cache/muscriptor/decoder.onnx.data \
            'https://huggingface.co/happyme531/muscriptor-medium-onnx/resolve/main/onnx/w4a32_optimized/decoder.onnx.data?download=true'

          python tools/inspect_decoder_graph.py --decoder .cache/muscriptor/decoder.onnx > ci/decoder-graph.txt
          python tools/generate_cache_variants.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders
          python tools/generate_native_gqa_cache.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders
          python tools/generate_k8v8_cache.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --output app/src/main/assets/cache_decoders

          g++ -std=c++20 -O3 -fPIC -shared -pthread \
            -I app/src/main/cpp/ort_headers \
            -I "$JAVA_HOME/include" \
            -I "$JAVA_HOME/include/linux" \
            app/src/main/cpp/k8v8_attention.cc \
            -o ci/libmuscriptor_k8v8_host.so

          python tools/smoke_test_cache_variants.py \
            --variants app/src/main/assets/cache_decoders \
            --external-data .cache/muscriptor/decoder.onnx.data \
            --max-cache 512
          python tools/validate_k8v8.py \
            --fp16 app/src/main/assets/cache_decoders/decoder-cache-fp16-native-gqa.onnx \
            --k8v8 app/src/main/assets/cache_decoders/decoder-cache-k8v8-native.onnx \
            --external-data .cache/muscriptor/decoder.onnx.data \
            --custom-library ci/libmuscriptor_k8v8_host.so \
            --max-cache 768 \
            --steps 4 | tee ci/k8v8-validation.txt
          python tools/benchmark_gqa_cache.py \
            --decoder .cache/muscriptor/decoder.onnx \
            --variants app/src/main/assets/cache_decoders \
            --external-data .cache/muscriptor/decoder.onnx.data \
            --max-cache 768 \
            --steps 10 | tee ci/cache-benchmark.txt
          ls -lh app/src/main/assets/cache_decoders ci/libmuscriptor_k8v8_host.so

      - name: Build and test
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          mkdir -p ci
          {
            echo "exit_code=$code"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%FT%TZ)"
            echo
            tail -n 700 build.log
          } > ci/android-build-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload debug APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: muscriptor-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Persist generated integration and reports
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/dev/cardrhyme/muscriptormobile/MuScriptorEngine.kt \
            app/src/main/java/dev/cardrhyme/muscriptormobile/MainActivity.kt \
            ci/android-build-report.txt \
            ci/decoder-graph.txt \
            ci/cache-benchmark.txt \
            ci/k8v8-validation.txt
          git commit -m "ci: persist K8V8 integration and validation reports" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
