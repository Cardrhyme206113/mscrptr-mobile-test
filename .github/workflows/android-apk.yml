name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [vulkan-small-clean]
    paths-ignore: ['**.md']

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK / NDK and native build tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers
          python3 -m pip install --user 'cmake==3.31.6' --break-system-packages
          CONFIG="/usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          if [ ! -f "$CONFIG" ]; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
            "$HOME/.local/bin/cmake" -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/spirv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-install"
            "$HOME/.local/bin/cmake" --install "$RUNNER_TEMP/spirv-build"
            CONFIG="$RUNNER_TEMP/spirv-install/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          fi
          test -f "$CONFIG"
          echo "SPIRV_HEADERS_DIR=$(dirname "$CONFIG")" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager unavailable"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Get pinned native MuScriptor source
        shell: bash
        run: |
          mkdir -p app/src/main/cpp/vendor
          git clone --depth 1 https://github.com/DamRsn/muscriptor.cpp.git app/src/main/cpp/vendor/muscriptor
          git -C app/src/main/cpp/vendor/muscriptor rev-parse HEAD
      - name: Build MuScriptor C++ (prefer Vulkan, CPU fallback)
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export SDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          COMMON=(
            -G Ninja
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-28
            -DCMAKE_BUILD_TYPE=Release
            -DMUSCRIPTOR_NATIVE=OFF
            -DSPIRV-Headers_DIR="$SPIRV_HEADERS_DIR"
          )
          if cmake -S app/src/main/cpp -B build/native "${COMMON[@]}" \
              -DANDROID_MUSCRIPTOR_VULKAN=ON \
              -DVulkan_INCLUDE_DIR="$SDK_SYSROOT/usr/include" \
              -DVulkan_LIBRARY="$SDK_SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so" \
              -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
              && cmake --build build/native --target muscriptor_jni -j 4; then
            echo "**Native backend:** Vulkan + CPU fallback" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Vulkan compilation failed, attempting CPU-only fallback"
            rm -rf build/native
            cmake -S app/src/main/cpp -B build/native "${COMMON[@]}" -DANDROID_MUSCRIPTOR_VULKAN=OFF
            cmake --build build/native --target muscriptor_jni -j 4
            echo "**Native backend:** CPU-only (Vulkan build failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/native/libmuscriptor_jni.so app/src/main/jniLibs/arm64-v8a/
      - name: Assemble installable debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuScriptor-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
