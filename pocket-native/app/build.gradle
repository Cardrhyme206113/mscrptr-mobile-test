plugins { id 'com.android.application' }
android {
    namespace 'com.muscript.pocket'
    compileSdk 35
    defaultConfig { applicationId 'com.muscript.pocket'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'onnx' }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1' }
